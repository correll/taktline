<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/taktline-mark.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Taktline — digital kanban &amp; MES for small manufacturers</title>
    <meta name="description" content="See your whole shop floor at a glance: every lot, every station, live on your own floor plan — so you know what is where, what is late, and what a job actually costs. Digital kanban for job shops and assembly lines. Free forever, no credit card." />
    <link rel="canonical" href="https://taktline.com/" />
    <meta name="theme-color" content="#D85A30" />

    <!-- Installable app. `orientation: any` on purpose: the layout already
         switches to the Operator dashboard in portrait and the map in
         landscape, so locking it would break one of the two. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Taktline" />

    <!-- Link previews (LinkedIn, Slack, WhatsApp, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Taktline" />
    <meta property="og:url" content="https://taktline.com/" />
    <meta property="og:title" content="Your whole shop floor, at a glance." />
    <meta property="og:description" content="Know what is where, what is late, and what a job actually costs. Digital kanban for job shops and assembly lines. Free forever, no credit card." />
    <meta property="og:image" content="https://taktline.com/landing/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Taktline — your whole shop floor, at a glance" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Your whole shop floor, at a glance." />
    <meta name="twitter:description" content="Know what is where, what is late, and what a job actually costs." />
    <meta name="twitter:image" content="https://taktline.com/landing/og-cover.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Apply the saved day/night theme before first paint (no flash).
      try {
        var t = localStorage.getItem('taktline.theme')
        if (t === 'day' || t === 'night') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
