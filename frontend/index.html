    <noscript>
      <!-- Most crawlers execute JavaScript; plenty do not, and the ones that do
           not used to see an empty page. This is the same story the rendered
           landing page tells, in plain HTML. -->
      <main style="max-width:44rem;margin:0 auto;padding:2rem 1.25rem;font-family:Inter,system-ui,sans-serif;line-height:1.6">
        <h1>Taktline — your whole shop floor, at a glance</h1>
        <p>
          Taktline is a browser-based <strong>digital kanban and manufacturing
          execution system</strong> for small manufacturers: job shops, assembly
          lines and remanufacturers of roughly 5&ndash;200 people. Every lot and
          every station is live on your own floor plan, so you know what is
          where, what is late, and what a job actually costs.
        </p>
        <h2>What changes</h2>
        <ul>
          <li><strong>You stop searching for lots.</strong> Every lot is on the board and the floor plan, live, with the history of everywhere it has been — true the hour you draw your line, with no data and no setup.</li>
          <li><strong>Continuous improvement starts immediately.</strong> Lean normally begins with a value-stream map, which means a study and often a consultant. Here the map is the line you already drew, live from the first lot that moves.</li>
          <li><strong>Workers understand the line they are in.</strong> The operator sees the whole flow — what feeds their bench, what waits on it, and where the constraint is. People who can see the system improve it.</li>
        </ul>
        <h2>What it does</h2>
        <ul>
          <li><strong>Live kanban board</strong> — one column per location, every lot card where it actually is.</li>
          <li><strong>Floor plan map to scale</strong> — with a heatmap showing where work piles up, and real transport distance in metres.</li>
          <li><strong>Pull scheduling</strong> — releasing an order for a finished product orders every precursor down to the material queues.</li>
          <li><strong>Merging and splitting</strong> — assemblies and disassemblies are modelled properly: one battery tears down into modules, busbars and cables, each its own product.</li>
          <li><strong>Timing that means something</strong> — takt time (the beat demand sets), cycle time (how long the work takes), line cycle time (how often a piece really leaves) and OEE, per location.</li>
          <li><strong>Operator dashboard</strong> — a tablet at each station: pick a lot, press start, press stop. Barcode scan-to-advance included.</li>
          <li><strong>A line doctor that reads your floor</strong> — an expert system, running on our own server, that reports the constraint, where work piles up, how much of your lead time is actually work, and what to fix first. It applies Little's law, Kingman's formula, the theory of constraints and Shewhart's common/special-cause split to the numbers Taktline already measures, and explains each finding in the language of lean. It works from the shape of your graph before anyone has run a timer, and no production data is sent anywhere.</li>
          <li><strong>Runs on the phone in your pocket</strong> — the whole manufacturing graph opens on an iPhone, iPad or Android device in the browser, with nothing to install and no app store. Held upright, a phone becomes the operator dashboard by itself. Pick a lot, press start, press stop when the job is done — and the moment it moves on, the floor plan on every other tablet and screen updates instantly, over a live connection.</li>
          <li><strong>ERP and store integration</strong> — Odoo, NetSuite, Shopify, WooCommerce, QuickBooks, Xero and ShipStation, plus CSV import and a plain JSON connector.</li>
        </ul>
        <h2>How it is priced</h2>
        <p>Free to get started — no credit card, no seat limits, and your data exports at any time.</p>
        <h2>Read more</h2>
        <p>

          the app serves it. <a href="/signup">Create a free account</a> or
          <a href="/login">sign in</a>.
        </p>
