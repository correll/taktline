# Render Blueprint — one web service (API + SPA on a single origin) and one
# Postgres database. Point Render at this repo ("New → Blueprint") and it
# provisions both and wires DATABASE_URL.
#
# Values marked `sync: false` are NOT stored in the repo; Render prompts for
# them on first deploy (or leave them blank and fill them in later under
# Environment). Everything else is either derived or safe to commit.

# Render Postgres, billed with the web service. `basic-256mb` (~$6/mo) has no
# expiry and no pause — unlike the `free` plan, which is deleted 30 days after
# creation. Applying this blueprint therefore starts billing immediately; swap
# the plan or delete this block if that is not what you want.

databases:
  - name: taktline-db
    databaseName: taktline
    user: taktline
    plan: basic-256mb
    ipAllowList: []          # empty → reachable only from inside Render's network

services:
  - type: web
    name: taktline
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Always on. `free` sleeps after ~15 min idle and pays a ~40 s cold start on
    # the next request, which is wrong for a floor that opens at 6am.
    plan: starter
    region: oregon
    healthCheckPath: /health

    # Migrations run ONCE, here, before the new instance is started and before
    # any traffic moves. If this fails the deploy aborts and the currently
    # running version keeps serving — which is the whole point. Running
    # `alembic upgrade head` from the container's start command instead means a
    # bad migration takes the service down and then crash-loops re-running it.
    preDeployCommand: "alembic upgrade head"

    # ONE instance, deliberately. The WebSocket connection registry, the
    # per-IP rate limiter and the usage meter all live in process memory, so a
    # second instance would serve boards that never receive another instance's
    # events. Scaling out needs a cross-instance relay first — see the scaling
    # note in DEPLOY.md.
    numInstances: 1

    envVars:
      # ── Wired automatically ───────────────────────────────────────────────
      # `connectionString`, NOT `connectionPoolString`. The pooled endpoint is
      # PgBouncer in transaction mode, which breaks asyncpg's prepared
      # statements ("prepared statement _asyncpg_… already exists") unless the
      # driver's statement cache is disabled. We do not need it: the app keeps
      # its own SQLAlchemy pool and runs as a single instance. Render hands out
      # `postgresql://…`, which is normalized to asyncpg at boot.
      #
      # To use an external database instead (Neon, Supabase, RDS), delete the
      # `databases:` block above and make this `sync: false`, then paste the
      # connection string into the dashboard.
      - key: DATABASE_URL
        fromDatabase:
          name: taktline-db
          property: connectionString
      # ── Production posture ────────────────────────────────────────────────
      - key: TAKTLINE_DEV
        value: "0"                     # disables dev links + /auth/dev/bootstrap
      - key: COOKIE_SECURE
        value: "1"                     # Render terminates TLS; cookies are HTTPS-only
      - key: COOKIE_SAMESITE
        value: lax                     # same-origin hosting → no cross-site cookies

      # The public URL of this deployment — it is what the links in
      # verification / invite / password-reset emails are built from. Set to the
      # custom domain up front so those links are right from the first account;
      # until the domain resolves (DEPLOY.md step 6) a link can still be
      # used by swapping the host for the .onrender.com one — the token is the
      # same. Change this if you deploy somewhere else.
      - key: FRONTEND_BASE_URL
        value: https://taktline.com

      # ── Set these after the first deploy (Render prompts) ─────────────────
      # Platform staff (customer-service dashboard at /platform). Deliberately
      # env-only: no API path can mint an owner.
      - key: PLATFORM_OWNER_EMAILS
        sync: false
      # Outbound email. Without it Taktline runs, but verification and invite
      # links are only printed to the service log, so nobody but you can ever
      # join. Resend (DEPLOY.md step 2): host smtp.resend.com, user the literal
      # "resend", password your API key. Any other SMTP provider works too.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # The From address. Must be a sender/domain you have verified with the
      # provider, or it will refuse the message.
      - key: SMTP_FROM
        sync: false
      # Shortcut for SendGrid specifically (paid): set this instead of the
      # SMTP_* trio and the host/user are filled in for you.
      - key: SENDGRID_API_KEY
        sync: false
      # ── Billing (Stripe) — the launch switch ─────────────────────────────
      # All four empty = billing is dormant: nothing is metered, nothing can
      # be purchased, no webhook is accepted, and the app runs exactly as it
      # did before the paywall existed. Setting STRIPE_SECRET_KEY is the act
      # of going live. Fill the price ids from `setup_stripe.py` run with the
      # LIVE key (test and live mode have different ids), and the webhook
      # secret from the endpoint you register at Dashboard → Webhooks.
      # The runbook is DEPLOY.md → "Going live with billing".
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_TAKTLINE
        sync: false
      - key: STRIPE_PRICE_ONPREM
        sync: false

# ── Staging ───────────────────────────────────────────────────────────────────
# Uncomment both blocks to get a second, identical deployment tracking a
# `staging` branch against its own database, so a release can be exercised
# before it takes customer traffic. See "Deploying without downtime" in
# DEPLOY.md. It costs a second instance and a second database — delete it again
# when you are not using it.
#
# Two things it must NOT share with production: the database (obviously) and
