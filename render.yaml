# Render Blueprint — one web service (API + SPA on a single origin) and one
# Postgres database. Point Render at this repo ("New → Blueprint") and it
# provisions both, wires DATABASE_URL, and generates SECRET_KEY.
#
# Values marked `sync: false` are NOT stored in the repo; Render prompts for
# them on first deploy (or leave them blank and fill them in later under
# Environment). Everything else is either derived or safe to commit.

# No `databases:` block by default — deliberately, twice over. Render's FREE
# Postgres expires 30 days after creation, and a blueprint that hands you a
# one-month fuse is worse than one that asks for a connection string; and a
# blueprint that silently creates a *paid* database bills you on apply. So
# DATABASE_URL is prompted instead, and works with any provider.
#
# Want everything on Render and billed together? Uncomment this and set
# DATABASE_URL back to `fromDatabase` (see DEPLOY.md → Which Postgres). Check
# the plan name against Render's current Postgres plans before applying.
#
# databases:
#   - name: taktline-db
#     databaseName: taktline
#     user: taktline
#     plan: basic-256mb        # ~$6/mo · no expiry · 1 GB storage
#     ipAllowList: []          # empty → reachable only inside Render's network

services:
  - type: web
    name: taktline
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # `free` sleeps after ~15 min idle and pays a ~40 s cold start on the next
    # request. `starter` (~$7/mo) is always on — the fix for a 6am shift.
    plan: free
    region: oregon
    healthCheckPath: /health

    # ONE instance, deliberately. The WebSocket connection registry, the
    # per-IP rate limiter and the usage meter all live in process memory, so a
    # second instance would serve boards that never receive another instance's
    # events. Scaling out needs a cross-instance relay first — see the scaling
    # note in DEPLOY.md.
    numInstances: 1

    envVars:
      # ── Wired automatically ───────────────────────────────────────────────
      # Paste the connection string your provider gives you, verbatim.
      # postgresql://…, postgres://… and Neon's trailing
      # ?sslmode=require&channel_binding=require are all normalized to asyncpg
      # at boot, so there is nothing to hand-edit.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true            # 32-byte random, stored by Render, never in git

      # ── Production posture ────────────────────────────────────────────────
      - key: TAKTLINE_DEV
        value: "0"                     # disables dev links + /auth/dev/bootstrap
      - key: COOKIE_SECURE
        value: "1"                     # Render terminates TLS; cookies are HTTPS-only
      - key: COOKIE_SAMESITE
        value: lax                     # same-origin hosting → no cross-site cookies

      # The public URL of this deployment — it is what the links in
      # verification / invite / password-reset emails are built from. Set to the
      # custom domain up front so those links are right from the first account;
      # until the domain resolves (see DEPLOY.md step 5) a link can still be
      # used by swapping the host for the .onrender.com one — the token is the
      # same. Change this if you deploy somewhere else.
      - key: FRONTEND_BASE_URL
        value: https://taktline.com

      # ── Set these after the first deploy (Render prompts) ─────────────────
      # Platform staff (customer-service dashboard at /platform). Deliberately
      # env-only: no API path can mint an owner.
      - key: PLATFORM_OWNER_EMAILS
        sync: false
      # Outbound email — any SMTP provider. Without it Taktline runs, but
      # verification and invite links are only printed to the service log, so
      # nobody but you can ever join. SendGrid's free plan ended in May 2025.
      # Resend is the documented default: 3k/month free and no provider
      # branding on your email. See DEPLOY.md → Email.
      #   Resend: smtp.resend.com      : 587   (user "resend")
      #   Brevo:  smtp-relay.brevo.com : 587   (more per day, but brands it)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # The From address. Must be a sender/domain you have verified with the
      # provider, or it will refuse the message.
      - key: SMTP_FROM
        sync: false
      # Shortcut for SendGrid specifically (paid): set this instead of the
      # SMTP_* trio and the host/user are filled in for you.
      - key: SENDGRID_API_KEY
        sync: false
